<h2>$t('editor.addComponentTitle')</h2>

<p class="muted">
    $t('editor.addComponentHint')
</p>

<div class="field">
    <label for="new-component">$t('editor.componentType')</label>
    <select id="new-component">
        {{choices}}
    </select>
</div>

<div class="divider"></div>

<button type="button" class="btn dark"
    data-editor-action="confirm-add-component"
    data-path="{{path}}">
    $t('editor.addToMenu')
</button>
