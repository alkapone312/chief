<div class="optionrow">
    <input aria-label="$t('editor.choiceName')"
        value="{{label}}"
        data-edit="opt:{{path}}:{{index}}:label">

    <input aria-label="$t('editor.extraCharge')"
        type="number" min="0" step="0.01"
        value="{{price}}"
        data-edit="opt:{{path}}:{{index}}:priceDelta">

    <button type="button" class="btn danger small"
        data-editor-action="remove-option"
        data-path="{{nodePath}}" data-index="{{index}}"
        aria-label="$t('editor.removeChoice')">
        ×
    </button>
</div>
