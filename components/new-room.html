<p class="eyebrow">$t('room.new')</p>
<h2>$t('room.question')</h2>

<p class="muted">
    $t('room.sample')
</p>

<form id="create-room-form">
    <div class="field">
        <label for="new-room-name">$t('room.name')</label>
        <input id="new-room-name" maxlength="100" required
            placeholder="$t('room.placeholder')">
    </div>

    <div class="divider"></div>

    <button class="btn dark" type="submit">
        $t('room.create')
    </button>
</form>
